<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Battle March{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-frame">
        <aside class="site-sidebar">
            <a class="site-brand" href="/">Battle March</a>
            <p class="site-subtitle">Old World League Ledger</p>
            <nav aria-label="Primary navigation">
                <a class="side-link" href="/players">Leaderboard</a>
                <a class="side-link" href="/rounds">Rounds</a>
                <a class="side-link" href="/admin">Admin</a>
            </nav>
        </aside>

        <main class="page-shell">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
