{% extends "base.html" %}

{% block title %}Edit Player - Battle March{% endblock %}

{% block content %}
        <p><a href="/admin/players">Back to players</a></p>
        <section class="page-header"><div class="eyebrow">Admin</div><h1>Edit {{ player.name }}</h1></section>
        <form class="admin-form" method="post" action="/admin/players/{{ player.id }}/edit">
            <label class="form-label" for="name">Player name</label>
            <input class="form-control" id="name" name="name" value="{{ player.name }}" required>
            <button class="btn btn-dark mt-3" type="submit">Save player</button>
        </form>
{% endblock %}
