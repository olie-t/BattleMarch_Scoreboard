<tr id="match-{{ match.id }}">
    <td>Round {{ match.round.number }}</td>
    <td>{{ match.player_one.name }}</td>
    <td>
        <input
            class="form-control form-control-sm"
            form="score-form-{{ match.id }}"
            name="player_one_score"
            type="number"
            min="0"
            value="{{ match.player_one_score if match.player_one_score is not none else "" }}"
            aria-label="{{ match.player_one.name }} victory points"
        >
    </td>
    <td>{{ match.player_two.name }}</td>
    <td>
        <input
            class="form-control form-control-sm"
            form="score-form-{{ match.id }}"
            name="player_two_score"
            type="number"
            min="0"
            value="{{ match.player_two_score if match.player_two_score is not none else "" }}"
            aria-label="{{ match.player_two.name }} victory points"
        >
    </td>
    <td>
        <form
            id="score-form-{{ match.id }}"
            method="post"
            action="/admin/matches/{{ match.id }}/scores"
            hx-post="/admin/matches/{{ match.id }}/scores"
            hx-target="#match-{{ match.id }}"
            hx-swap="outerHTML"
        >
            <button class="btn btn-sm btn-dark" type="submit">Save VP</button>
            <a class="btn btn-sm btn-outline-dark" href="/admin/matches/{{ match.id }}/edit">Edit match</a>
        </form>
        <form
            class="d-inline"
            method="post"
            action="/admin/matches/{{ match.id }}/reset"
            hx-post="/admin/matches/{{ match.id }}/reset"
            hx-target="#match-{{ match.id }}"
            hx-swap="outerHTML"
        >
            <button class="btn btn-sm btn-outline-danger" type="submit">Reset match</button>
        </form>
    </td>
</tr>
