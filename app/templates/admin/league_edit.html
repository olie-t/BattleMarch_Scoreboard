{% extends "base.html" %}

{% block title %}Edit League - Battle March{% endblock %}

{% block content %}
        <p><a href="/admin/leagues">Back to leagues</a></p>
        <section class="page-header"><div class="eyebrow">Admin</div><h1>Edit {{ league.name }}</h1></section>
        <form class="admin-form" method="post" action="/admin/leagues/{{ league.id }}/edit">
            <label class="form-label" for="name">League name</label>
            <input class="form-control" id="name" name="name" value="{{ league.name }}" required>
            <button class="btn btn-dark mt-3" type="submit">Save league</button>
        </form>
{% endblock %}
